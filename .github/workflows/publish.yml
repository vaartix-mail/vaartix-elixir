name: Publish to Hex
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # Hex has no trusted publishing yet, so this uses an API key stored only in the "hex"
    # environment (Settings → Environments → hex → HEX_API_KEY), limited to writing packages.
    environment: hex
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -oP '@version "\K[^"]+' mix.exs)"
      - run: mix deps.get
      - run: mix test
        env:
          MIX_ENV: test
      - name: Publish package and docs
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
